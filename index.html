        function confirmGeneralDepositSubmitted(amount) {
            const utr = document.getElementById('gen-utr-input').value.trim();
            const screenshot = document.getElementById('gen-screenshot-input').files[0];

            if(!utr || utr.length < 8) {
                showToast("Please enter a valid 12-digit UTR / Reference number", "error");
                return;
            }
            if(!screenshot) {
                showToast("Please upload payment screenshot", "error");
                return;
            }

            showLoadingPopup("Verifying Deposit Payment...");

            setTimeout(() => {
                closeModal();
                appState.user.balance += amount;
                appState.deposits.unshift({
                    id: 'DEP-' + Math.floor(100000 + Math.random() * 900000),
                    amount: amount,
                    utr: utr,
                    status: 'SUCCESS',
                    date: new Date().toLocaleDateString()
                });
                saveState();
                showToast(`Deposit of ₹${amount} successful & added to wallet!`);
                renderApp();
            }, 1800);
        }

        // --- ASSETS VIEW ---
